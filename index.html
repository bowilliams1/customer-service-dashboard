<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSH Customer Service</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c08; --panel:#0d130d; --panel2:#111911; --edge:#1d2a1d; --edge-lit:#2c4a2c;
  --green:#6abf4b; --green-dim:#3d7a2c; --text:#e6efe4; --dim:#7d917b;
  --red:#e05252; --red-dim:#5a2020; --amber:#e0a940;
  --ne:#6abf4b; --bc:#e0a940; --mu:#4ba5bf; --ph:#b07ad6;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  background-image:
    linear-gradient(rgba(106,191,75,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(106,191,75,.025) 1px, transparent 1px);
  background-size:44px 44px;
  min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
.dim{color:var(--dim);}

/* header */
header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
header img{height:40px;}
header .title{font-size:26px;text-transform:uppercase;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}

/* panel with corner brackets */
.panel{
  position:relative; background:var(--panel); border:1px solid var(--edge);
  padding:18px; margin-bottom:20px;
}
.panel::before,.panel::after{
  content:''; position:absolute; width:10px; height:10px; border-color:var(--green);
  border-style:solid; border-width:0;
}
.panel::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;}
.panel::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;}
.section-head{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  font-size:13px; letter-spacing:.08em; color:var(--dim); margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:center;
}

/* KPI strip */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.kpi{
  background:var(--panel); border:1px solid var(--edge); border-left:3px solid var(--green);
  padding:14px 16px;
}
.kpi.red{border-left-color:var(--red);}
.kpi .num{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1;}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:6px;}

/* badges */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:3px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:600;color:#0a0f0a;flex-shrink:0;
}
.badge.ne{background:var(--ne);} .badge.bc{background:var(--bc);}
.badge.mu{background:var(--mu);} .badge.ph{background:var(--ph);}
.badge.internal{background:var(--dim);}
/* Brand icons instead of NE / BC letters (Bo, 2026-09-26): a green leaf = Natural Elements, the swoosh from
   the BOSH logo = BOSH Chemical. */
.badge.brand{background:transparent;border:1px solid var(--edge-lit);width:40px;}
.badge.brand svg{width:20px;height:20px;color:var(--ne);display:block;}
.badge.brand img{height:19px;width:auto;display:block;}
.badge.brand.sm{width:30px;height:20px;border:none;vertical-align:middle;}
.badge.brand.sm svg{width:16px;height:16px;}
.badge.brand.sm img{height:15px;}
.kpi .label .badge.brand.sm{margin-right:6px;vertical-align:-5px;}
.section-head .badge.brand.sm{margin-right:8px;vertical-align:-5px;}

.tier{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  text-transform:uppercase; letter-spacing:.05em; padding:3px 7px; border-radius:2px;
}
.tier.GREEN{background:rgba(106,191,75,.15);color:var(--green);}
.tier.YELLOW{background:rgba(224,169,64,.15);color:var(--amber);}
.tier.RED{background:rgba(224,82,82,.18);color:var(--red);}

/* queue rows */
.row{
  display:flex; gap:12px; align-items:flex-start; padding:14px 12px;
  border-bottom:1px solid var(--edge); cursor:pointer;
}
.row:last-child{border-bottom:none;}
.row:hover{background:var(--panel2);}
.row .meta{flex:1;min-width:0;}
.row .subject{font-weight:500;}
.row .from{font-size:12px;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
.row .snippet{font-size:12px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{color:var(--dim);font-size:13px;padding:20px;text-align:center;}

/* detail / editor */
.detail-body{white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;background:var(--panel2);border:1px solid var(--edge);padding:12px;margin:8px 0;}
textarea{
  width:100%; min-height:240px; background:var(--panel2); color:var(--text);
  border:1px solid var(--edge-lit); font-family:'IBM Plex Mono',monospace; font-size:13px;
  padding:12px; line-height:1.5;
}
.btn{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; font-size:13px; padding:10px 18px; border:1px solid var(--edge-lit);
  background:var(--panel2); color:var(--text); cursor:pointer;
}
.btn:hover{border-color:var(--green);}
.btn.primary{background:var(--green-dim);border-color:var(--green);color:#fff;}
.btn.danger{border-color:var(--red-dim);color:var(--red);}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
/* Detail pop-up scrolls on its own. Before this, a long thread (Karen, 2026-09-25) ran off the
   bottom of the screen with no way to reach the draft or the Send button. */
#detail-overlay{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px;}
#detail-panel{max-width:760px;margin:24px auto 60px;}
body.modal-open{overflow:hidden;}
.detail-body{overflow-wrap:anywhere;}
details.older{margin:6px 0 4px;}
details.older > summary{cursor:pointer;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:6px 0;}
details.older .detail-body{max-height:50vh;overflow-y:auto;}
textarea{box-sizing:border-box;}
.redraft{margin-top:16px;border-top:1px solid var(--edge);padding-top:12px;}
.redraft input{width:100%;box-sizing:border-box;background:var(--panel2);color:var(--text);border:1px solid var(--edge-lit);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px;margin:6px 0 8px;}
@media (max-width:560px){
  #detail-panel{margin:12px auto 40px;}
  textarea,.redraft input{font-size:16px;} /* 16px+ stops phones from zooming in on tap */
}

/* Answer Library (2026-09-26) */
.btn:disabled{opacity:.5;cursor:wait;}
.banner{border:1px solid var(--amber);color:var(--amber);background:rgba(224,169,64,.08);padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:16px;}
.banner.red{border-color:var(--red);color:var(--red);background:rgba(224,82,82,.08);}
.pill.ok{background:rgba(106,191,75,.15);color:var(--green);}
.pill.warn{background:rgba(224,169,64,.15);color:var(--amber);}
.pill{display:inline-block;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:2px;margin-right:6px;background:rgba(224,82,82,.18);color:var(--red);}
.product-line{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:6px;}
details.libbox > summary{color:var(--green);}
.libitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--edge);background:var(--panel2);font-size:13px;line-height:1.45;}
.libitem:first-of-type{border-top:none;}
.libitem .txt{flex:1;min-width:0;overflow-wrap:anywhere;}
.libitem .kind{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);}
.libitem .used{color:var(--green);}
.libitem .btn{font-size:11px;padding:5px 10px;flex-shrink:0;}
.libitem.retired .txt{opacity:.45;text-decoration:line-through;}
.libhelp{font-size:12px;color:var(--dim);padding:8px 12px;background:var(--panel2);border-top:1px solid var(--edge);}
.redraft .remember{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px;cursor:pointer;}
.redraft .remember input{width:18px;height:18px;margin:0;padding:0;flex-shrink:0;}
#remember-status{font-size:13px;margin-top:10px;line-height:1.5;}
#remember-status .btn{font-size:11px;padding:4px 10px;margin-left:8px;}

/* PIN gate */
#pin-gate{
  min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:18px;
}
#pin-gate input{
  background:var(--panel2); border:1px solid var(--edge-lit); color:var(--text);
  font-family:'IBM Plex Mono',monospace; font-size:18px; padding:12px 16px; text-align:center;
  letter-spacing:.2em; width:220px;
}
#pin-error{color:var(--red);font-size:12px;min-height:16px;}

#app{display:none;}
.coming-soon{opacity:.4;font-size:12px;font-family:'IBM Plex Mono',monospace;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:820px){.two-col{grid-template-columns:1fr;}}
</style>
</head>

function brandBadge(code, small){
  const cls = 'badge brand' + (small ? ' sm' : '');
  if (code === 'ne') return '<span class="' + cls + '" role="img" title="Natural Elements" aria-label="Natural Elements">' + LEAF_SVG + '</span>';
  if (code === 'bc') return '<span class="' + cls + '" role="img" title="BOSH Chemical" aria-label="BOSH Chemical">' + SWOOSH_IMG + '</span>';
  return '<span class="badge ' + code + '">' + escapeHtml(String(code).toUpperCase()) + '</span>';
}

let PIN = '';
let allRows = []; // each row carries a synthetic _engine field so actions know where to POST

function unlock(){
  PIN = document.getElementById('pin-input').value.trim();
  if (!PIN) return;
  document.getElementById('pin-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}
document.getElementById('legend-ne').innerHTML = brandBadge('ne', true);
document.getElementById('legend-bc').innerHTML = brandBadge('bc', true);
document.getElementById('pin-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') unlock();
});

function activeEngines(){
  return ENGINES.filter(function(e){ return e.url && e.url.indexOf('PASTE_') !== 0; });
}

async function loadAll(){
  const engines = activeEngines();
  // Apps Script can take 15-30s to wake up, so show that we're working instead of an empty queue.
  document.getElementById('queue-list').innerHTML = '<div class="empty">Loading ' + engines.length + ' inboxes… this can take up to 30 seconds.</div>';
  const results = await Promise.all(engines.map(function(engine){
    return fetch(engine.url + '?action=getData&pin=' + encodeURIComponent(PIN))
      .then(function(r){ return r.json(); })
      .then(function(data){ return { engine: engine, data: data }; })
      .catch(function(err){ return { engine: engine, data: { error: String(err) } }; });
  }));

  allRows = [];
  let anyPinError = false;
  let lockedMsg = '';
  const failed = [];
  unreadEngines = {};
  const libraryDown = [];
  results.forEach(function(result){
    const data = result.data;
    if (data.error === 'PIN required') anyPinError = true;
    else if (data.error && (data.locked || /locked|paused|too many wrong passwords/i.test(data.error))) lockedMsg = data.error;
    else if (data.error) failed.push(result.engine.label);
    if (data.error) unreadEngines[result.engine.code] = true;
    // Older engine versions don't report the library at all; only a reported problem shows the banner.
    if (data.library && data.library.ok === false) libraryDown.push({ name: result.engine.label, error: String(data.library.error || '') });
    if (data.inquiries) {
      data.inquiries.forEach(function(row){
        row._engineCode = result.engine.code;
        row._engineUrl = result.engine.url;
        allRows.push(row);
      });
    }
  });

  // A locked inbox (too many wrong passwords) only blocks itself when the other one still opened.
  const lockedEngines = results.filter(function(r){ return r.data.error && (r.data.locked || /locked|paused|too many wrong passwords/i.test(r.data.error)); }).map(function(r){ return r.engine.label; });
  const openedAny = results.some(function(r){ return r.data.ok; });
  let pausedNote = '';
  if (lockedMsg && openedAny && !anyPinError) {
    pausedNote = lockedEngines.join(' and ') + ' is paused for up to 15 minutes because too many wrong passwords were tried (not necessarily by you). The other inbox works normally.';
    lockedMsg = '';
  }
  if (anyPinError || lockedMsg) {
    document.getElementById('pin-error').textContent = anyPinError ? 'Wrong password.' : lockedMsg;
    document.getElementById('pin-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }

  document.getElementById('banner-area').innerHTML = libraryDown.length
    ? '<div class="banner">The Answer Library isn\u2019t connected for ' + libraryDown.map(function(d){ return escapeHtml(d.name); }).join(' and ') +
      ' right now. Replies still draft and send normally, and anything you send is saved to the library once it\u2019s back.' +
      '<div class="mono dim" style="font-size:11px;margin-top:6px;">Details: ' + libraryDown.map(function(d){ return escapeHtml(d.name + ': ' + d.error); }).join(' \u00b7 ') + '</div></div>'
    : '';
  // Never let a broken engine look like "all caught up" (kept on every re-render of the queue).
  queueNotesHtml = (pausedNote ? '<div class="empty" style="color:var(--amber)">' + escapeHtml(pausedNote) + '</div>' : '') +
    (failed.length ? '<div class="empty" style="color:var(--red)">Couldn\u2019t reach: ' + failed.map(escapeHtml).join(', ') + '. Tap Refresh to try again.</div>' : '');
  // Drafts written with a note or past reply that has since been retired (the engine checks; this page adds
  // anything retired since the last load, in both inboxes).
  allRows.forEach(function(r){ r._usesRetired = !!r._libraryRetired || usesRetiredId(r); });
  renderKpis();
  renderQueue();
}
let queueNotesHtml = '';
const retiredLibIds = {};
function usesRetiredId(r){
  const u = parseLibraryUsed(r['Library Used']);
  if (!u) return false;
  const ids = (u.facts || []).map(function(f){ return f.id; }).concat((u.answers || []).map(function(a){ return a.id; }), u.relied || []);
  return ids.some(function(id){ return retiredLibIds[id]; });
}
let unreadEngines = {};

// SENDING = a Send that was interrupted (it may or may not have gone out). It stays in the queue,
// on top, until Bo checks Gmail Sent.
function isOpen(r){ return r.Status === 'PENDING' || r.Status === 'APPROVED' || r.Status === 'SENDING'; }

function renderKpis(){
  const pending = allRows.filter(isOpen);
  const red = pending.filter(function(r){ return r['Safety Tier'] === 'RED'; });
  const byEngine = {};
  activeEngines().forEach(function(e){ byEngine[e.code] = 0; });
  pending.forEach(function(r){ byEngine[r._engineCode] = (byEngine[r._engineCode] || 0) + 1; });

  let html = '';
  html += kpiTile(pending.length, 'Pending review', red.length > 0);
  html += kpiTile(red.length, 'Flagged RED', red.length > 0);
  activeEngines().forEach(function(e){
    html += kpiTile(unreadEngines[e.code] ? '\u2013' : (byEngine[e.code] || 0), brandBadge(e.code, true) + e.label);
  });
  document.getElementById('kpi-row').innerHTML = html;
}
function kpiTile(num, label, isRed){
  return '<div class="kpi' + (isRed ? ' red' : '') + '"><div class="num">' + num +
    '</div><div class="label">' + label + '</div></div>';
}

function renderQueue(){
  const rank = function(r){ return r.Status === 'SENDING' ? 0 : r['Safety Tier'] === 'RED' ? 1 : 2; };
  const pending = allRows.filter(isOpen).sort(function(a,b){ return rank(a) - rank(b); });

  const list = document.getElementById('queue-list');
  if (pending.length === 0) {
    list.innerHTML = queueNotesHtml + '<div class="empty">Nothing waiting \u2014 all caught up.</div>';
    return;
  }
  list.innerHTML = queueNotesHtml + pending.map(function(row){
    const isInternal = String(row.Category || '').indexOf('INTERNAL:') === 0;
    const badge = isInternal
      ? '<span class="badge internal" title="Internal note">→J</span>'
      : brandBadge(row._engineCode);
    return '<div class="row" onclick="openDetail(\'' + row['Row Key'] + '\',\'' + row._engineCode + '\')">' +
      badge +
      '<div class="meta">' +
        (row.Status === 'SENDING' ? '<div><span class="pill">Interrupted send: check Gmail Sent</span></div>' : '') +
        (redraftNotices[row._engineCode + '|' + row['Row Key']] ? '<div><span class="pill ok">Redraft finished: open to see</span></div>' : '') +
        (row._usesRetired ? '<div><span class="pill warn">Uses a note you retired: Redraft before sending</span></div>' : '') +
        '<div class="subject">' + escapeHtml(row.Subject || '(no subject)') + '</div>' +
        '<div class="from">' + escapeHtml(row.From || '') + ' · ' + escapeHtml(row.Category || '') + '</div>' +
        '<div class="snippet">' + escapeHtml((row.Draft || '').slice(0, 140)) + '</div>' +
      '</div>' +
      '<span class="tier ' + row['Safety Tier'] + '">' + row['Safety Tier'] + '</span>' +

  }).join('');
}

function findRow(rowKey, engineCode){

}

  applyRedraftBusy(key);
  if (redraftNotices[key]) {

function closeDetail(){
  document.getElementById('detail-overlay').style.display = 'none';

}

function productHtml(product){
  return product ? '<span class="dim">Product:</span> ' + escapeHtml(product)
    : '<span class="dim">Product: couldn\u2019t tell which one, so no saved answers were used. Name it in a Redraft note (for example \u201cthis is the mole repellent\u201d) and I\u2019ll use them.</span>';
}

// "From your library": the saved facts and past replies Claude was shown for this draft. Bo can
// retire anything that's wrong so no future draft uses it again.
function parseLibraryUsed(s){
  try { return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function libraryHtml(row){
  const u = parseLibraryUsed(row['Library Used']);
  const facts = (u && u.facts) || [], answers = (u && u.answers) || [], relied = (u && u.relied) || [];
  const n = facts.length + answers.length;
  if (!n) return '';
  const rk = row['Row Key'], ec = row._engineCode;
  let html = '<details class="older libbox"><summary>From your library (' + n + ')' +
    (relied.length ? ' \u00b7 ' + relied.length + ' used in this draft' : '') + '</summary>';
  facts.forEach(function(f){
    html += libItemHtml('fact', f.id, 'Saved fact \u00b7 ' + (f.product || '') + ' \u00b7 ' + String(f.savedAt || '').slice(0, 10),
      f.text, relied.indexOf(f.id) !== -1, 'Forget', rk, ec);
  });
  answers.forEach(function(a){
    html += libItemHtml('answer', a.id, 'Past reply' + (a.edited === 'YES' ? ' you edited' : '') + ' \u00b7 ' + String(a.savedAt || '').slice(0, 10) + (a.why ? ' \u00b7 ' + a.why : ''),
      'Customer asked: ' + (a.question || ''), relied.indexOf(a.id) !== -1, 'Don\u2019t reuse', rk, ec);
  });
  html += '<div class="libhelp">If one of these is wrong or out of date, retire it so no future draft uses it. Then Redraft this one.</div></details>';
  return html;
}
function libItemHtml(kind, id, kindLabel, text, used, btnLabel, rowKey, engineCode){
  return '<div class="libitem"><div class="txt"><div class="kind">' + escapeHtml(kindLabel) +
    (used ? ' \u00b7 <span class="used">used in this draft</span>' : '') + '</div>' + escapeHtml(text || '') + '</div>' +
    '<button class="btn" onclick="retireItem(\'' + kind + '\',\'' + escapeHtml(id) + '\',\'' + engineCode + '\', this)">' + btnLabel + '</button></div>';
}
async function retireItem(kind, id, engineCode, btn){
  const what = kind === 'fact' ? 'Forget this saved fact? Future drafts won\u2019t use it.' : 'Stop reusing this past reply? Future drafts won\u2019t see it.';
  if (btn && !confirm(what)) return;
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  try {
    const res = await fetch(engine.url, { method: 'POST', body: JSON.stringify({ action: 'retireLibraryItem', kind: kind, id: id, pin: PIN }) })
      .then(function(r){ return r.json(); });
    if (res.error) { alert(errText(res.error)); if (btn) { btn.disabled = false; btn.textContent = kind === 'fact' ? 'Forget' : 'Don\u2019t reuse'; } return false; }
    if (btn) { btn.textContent = kind === 'fact' ? 'Forgotten' : 'Won\u2019t reuse'; btn.closest('.libitem').classList.add('retired'); }
    // Other open drafts (in both inboxes: they share one library) written with it get a "Redraft before sending" mark.
    retiredLibIds[id] = true;
    allRows.forEach(function(r){ if (usesRetiredId(r)) r._usesRetired = true; });
    renderQueue();
    if (btn && res.replaced && res.replaced.length) {
      const f = res.replaced[0];
      btn.closest('.libitem').insertAdjacentHTML('afterend', '<div class="libhelp">It had replaced an older note: \u201c' + escapeHtml(f.text) + '\u201d ' +
        '<button class="btn" style="font-size:11px;padding:4px 10px;" onclick="restoreFact(\'' + escapeHtml(f.id) + '\',\'' + engineCode + '\', this)">Bring that one back</button></div>');
    }
    return true;
  } catch (err) {
    alert(netText(engine.label));
    if (btn) { btn.disabled = false; btn.textContent = kind === 'fact' ? 'Forget' : 'Don\u2019t reuse'; }
    return false;
  }
}

async function restoreFact(id, engineCode, btn){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  btn.disabled = true; btn.textContent = 'Bringing it back\u2026';
  try {
    const res = await fetch(engine.url, { method: 'POST', body: JSON.stringify({ action: 'restoreFact', id: id, pin: PIN }) }).then(function(r){ return r.json(); });
    if (res.error) { alert(errText(res.error)); btn.disabled = false; btn.textContent = 'Bring that one back'; return; }
    btn.textContent = 'Brought back';
    delete retiredLibIds[id];
  } catch (err) {
    alert(netText(engine.label)); btn.disabled = false; btn.textContent = 'Bring that one back';
  }
}

// "Remember this" result under the Redraft box, with Undo (which retires the fact just saved).
function rememberHtml(r, engineCode){
  if (!r) return '';
  if (!r.saved) return '<span style="color:var(--amber)">' + escapeHtml(r.reason || 'Not remembered.') + '</span>';
  const replaced = (r.replacedFacts || []).filter(function(f){ return f.text; });
  return '<span style="color:var(--green)">Remembered for ' + escapeHtml(r.where || 'this product') + ':</span> \u201c' + escapeHtml(r.text || '') + '\u201d' +
    '<button class="btn" onclick="undoRemember(\'' + escapeHtml(r.id) + '\',\'' + engineCode + '\', this)">Undo</button>' +
    (replaced.length ? '<div class="dim" style="margin-top:6px;">It replaced ' + (replaced.length === 1 ? 'this older note' : 'these older notes') + ' (Undo brings ' +
      (replaced.length === 1 ? 'it' : 'them') + ' back): ' + replaced.map(function(f){ return '\u201c' + escapeHtml(f.text) + '\u201d'; }).join('; ') + '</div>'
      : (r.replaced ? ' <span class="dim">(replaced ' + r.replaced + ' older note' + (r.replaced === 1 ? '' : 's') + '; Undo brings them back)</span>' : ''));
}
async function undoRemember(id, engineCode, btn){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  btn.disabled = true; btn.textContent = 'Undoing\u2026';
  try {
    const res = await fetch(engine.url, { method: 'POST', body: JSON.stringify({ action: 'undoRemember', id: id, pin: PIN }) })
      .then(function(r){ return r.json(); });
    if (res.error) { alert(errText(res.error)); btn.disabled = false; btn.textContent = 'Undo'; return; }
    const back = (res.restored || []).length;
    document.getElementById('remember-status').innerHTML = '<span class="dim">Undone. That note won\u2019t be used again' +
      (back ? ', and the ' + (back === 1 ? 'older note it replaced is' : back + ' older notes it replaced are') + ' back' : '') + '.</span>';
  } catch (err) {
    alert(netText(engine.label)); btn.disabled = false; btn.textContent = 'Undo';
  }
}

// "What Claude looked up": its research notes plus any web pages it used. For Bo only; the
// email itself never cites outside sources (brand rule).
function researchHtml(text){
  if (!text) return '';
  return '<details class="older"><summary>What Claude looked up</summary><div class="detail-body">' + escapeHtml(text) + '</div></details>';
}

// Splits the newest message from the quoted history below it (Gmail "On ... wrote:", ">" quote
// lines, Outlook "Original Message" / "From: ... Sent:") so a long thread doesn't bury what's new.
// If nothing sits above the quote, show everything rather than an empty box.
function splitThread(body){
  const s = String(body || '');
  const cands = [
    s.search(/(^|\n)On [^\n]{0,200}(\n[^\n]{0,200})?wrote:[ \t]*\r?\n/),
    s.search(/(^|\n)>/),
    s.search(/(^|\n)-{2,}\s*Original Message/i),
    s.search(/(^|\n)From: [^\n]+\n(Sent|Date): /),
  ].filter(function(i){ return i > 0; });
  if (!cands.length) return { latest: s, older: '' };
  const cut = Math.min.apply(null, cands);
  const latest = s.slice(0, cut).trim();
  if (!latest) return { latest: s, older: '' };
  return { latest: latest, older: s.slice(cut).trim() };
}

// Bo's Redraft button: sends his optional note to the engine, which re-runs Claude with it and updates the
// row in place. Reviewed 2026-09-26: the redraft is tracked per email, so closing and reopening that email
// keeps Send paused; the answer only lands in the email it belongs to; Bo's own edits made meanwhile are
// never overwritten; and if the email isn't open when it finishes, the result waits on its queue card.
const redraftsInFlight = {};
const redraftNotices = {};
function panelShows(key){
  return document.getElementById('detail-panel').dataset.row === key && document.getElementById('detail-overlay').style.display !== 'none';
}
function applyRedraftBusy(key){
  if (!panelShows(key)) return;
  const busy = !!redraftsInFlight[key];
  Array.prototype.slice.call(document.querySelectorAll('#action-row button')).forEach(function(b){ b.disabled = busy; });
  const rb = document.getElementById('redraft-btn');
  if (rb) rb.disabled = busy;
  const st = document.getElementById('redraft-status');
  if (st && busy) st.textContent = 'Redrafting\u2026 this can take up to a minute. Send is paused until it\u2019s done.';
}
async function doRedraft(rowKey, engineCode){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  const key = engineCode + '|' + rowKey;
  if (redraftsInFlight[key]) return;
  const note = document.getElementById('redraft-note').value.trim();
  const rememberBox = document.getElementById('remember-check');
  const remember = !!(rememberBox && rememberBox.checked);
  if (remember && !note) { document.getElementById('redraft-status').textContent = 'Type what to remember in the box first.'; return; }
  const startedDraft = document.getElementById('draft-edit').value;
  const storedRow = findRow(rowKey, engineCode);
  const storedDraft = storedRow ? String(storedRow.Draft || '') : startedDraft;
  document.getElementById('remember-status').innerHTML = '';
  redraftsInFlight[key] = { startedDraft: startedDraft };
  applyRedraftBusy(key);
  let res = null, failedNet = false;
  try {
    res = await fetch(engine.url, { method: 'POST', body: JSON.stringify({ action: 'redraft', rowKey: rowKey, note: note, remember: remember, pin: PIN }) })
      .then(function(r){ return r.json(); });
  } catch (err) {
    failedNet = true;
  }
  delete redraftsInFlight[key];
  const here = panelShows(key);
  if (here) {
    applyRedraftBusy(key);
    document.getElementById('redraft-status').textContent = '';
  }
  if (failedNet || res.error) {
    const msg = failedNet ? netText(engine.label) : errText(res.error);
    if (here) alert(msg);
    else { redraftNotices[key] = '<span style="color:var(--amber)">The redraft didn\u2019t go through: ' + escapeHtml(msg) + '</span>'; renderQueue(); }
    return;
  }
  const row = findRow(rowKey, engineCode);
  if (row) {
    row.Draft = res.draft; row['Safety Tier'] = res.tier; row['Safety Reasons'] = res.reasons; row.Category = res.category; row.Research = res.research;
    if (res.product !== undefined) row.Product = res.product;
    if (res.libraryUsed !== undefined) row['Library Used'] = res.libraryUsed;
    row._usesRetired = false;
  }
  const rememberNote = rememberHtml(res.remembered, engineCode);
  if (!here) {
    redraftNotices[key] = '<span style="color:var(--green)">The new draft is ready (it is in the box above).</span>' + (rememberNote ? '<div style="margin-top:6px;">' + rememberNote + '</div>' : '');
    renderKpis(); renderQueue();
    return;
  }
  const box = document.getElementById('draft-edit');
  const status = document.getElementById('redraft-status');
  if (box.value !== startedDraft && box.value !== storedDraft) {
    // Bo typed in the box while the redraft ran: keep his text, offer the new one.
    status.innerHTML = 'A new draft is ready, but you edited the text meanwhile, so yours is kept. ' +
      '<button class="btn" id="use-new-draft" style="font-size:11px;padding:4px 10px;">Use the new draft</button>';
    document.getElementById('use-new-draft').onclick = function(){ box.value = res.draft; status.textContent = 'New draft is in the box above. Review it, then Send.'; };
  } else {
    box.value = res.draft;
    status.textContent = 'New draft is ready above. Review it, then Send.';
  }
  const tierEl = document.getElementById('detail-tier');
  tierEl.textContent = res.tier; tierEl.className = 'tier ' + res.tier;
  document.getElementById('detail-flags').textContent = res.reasons ? ('Flags: ' + res.reasons) : '';
  document.getElementById('detail-research').innerHTML = researchHtml(res.research);
  const prodEl = document.getElementById('detail-product');
  if (prodEl && res.product !== undefined) prodEl.innerHTML = productHtml(res.product);
  if (row) document.getElementById('detail-library').innerHTML = libraryHtml(row);
  const rb = document.getElementById('remember-check');
  if (rb) rb.checked = false;
  document.getElementById('remember-status').innerHTML = rememberNote;
  renderKpis();
  renderQueue();
}

// Every button in the row is disabled while one action is in flight, so a double tap can't send twice.
async function doAction(action, rowKey, engineCode, btn){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  const editedDraft = document.getElementById('draft-edit') ? document.getElementById('draft-edit').value : undefined;
  const body = { action: action, rowKey: rowKey, pin: PIN };
  if (action === 'approveSend') body.editedDraft = editedDraft;
  // The Jeff note is written by the engine from the customer's email (order #, item, quantity, address),
  // never from the customer reply in the box (review 2026-09-26).

  const buttons = Array.prototype.slice.call(document.querySelectorAll('#action-row button'));
  const label = btn ? btn.textContent : '';
  buttons.forEach(function(b){ b.disabled = true; });
  if (btn) btn.textContent = action === 'approveSend' ? 'Sending\u2026' : action === 'createJeffNotification' ? 'Writing the note for Jeff\u2026' : 'Working\u2026';
  const post = function(b){ return fetch(engine.url, { method: 'POST', body: JSON.stringify(b) }).then(function(r){ return r.json(); }); };
  if (action === 'markSent' && !confirm('Only press OK if you found this exact reply in Gmail \u2192 Sent. It will be recorded as sent (nothing is emailed).')) { buttons.forEach(function(b){ b.disabled = false; }); if (btn) btn.textContent = label; return; }
  if (action === 'notSent' && !confirm('Only press OK if this reply is NOT in Gmail \u2192 Sent. It goes back to the queue so you can edit, redraft, send or reject it.')) { buttons.forEach(function(b){ b.disabled = false; }); if (btn) btn.textContent = label; return; }
  try {
    let res = await post(body);
    if (action === 'approveSend' && res.sendingUnclear) {
      // The row is now an interrupted send: show it with the "mark as sent" / "put it back" buttons.
      alert(res.error);
      const r0 = findRow(rowKey, engineCode);
      if (r0) { r0.Status = 'SENDING'; r0.Draft = res.sentText || editedDraft; } // exactly what may have gone out
      renderKpis(); renderQueue();
      openDetail(rowKey, engineCode);
      return;
    }
    if (action === 'approveSend' && res.maybeSent) {
      if (!confirm(res.error + '\n\nSend it again anyway?')) return;
      body.confirmResend = true;
      res = await post(body);
    }
    if (action === 'approveSend' && res.brandWarning) {
      if (!confirm(res.error + '\n\nPress Cancel to go back and fix it. Press OK only if you checked their order and it is the right brand.')) return;
      body.confirmBrand = true;
      res = await post(body);
    }
    if (res.error) { alert(errText(res.error)); return; }
    if (res.alreadySent) alert(action === 'markSent' ? 'It was already marked as sent.' : 'This reply was already sent earlier, so it was not sent again.');
    if (res.warning) alert(res.warning);
    closeDetail();
    loadAll();
  } catch (err) {
    alert(action === 'approveSend'
      ? 'Couldn\u2019t confirm the send (connection problem). Tap Refresh: if this email has left the queue, it was sent. Check Gmail Sent before trying again.'
      : netText(engine.label));
  } finally {
    buttons.forEach(function(b){ b.disabled = false; });
    if (btn) btn.textContent = label;
  }
}

// The engine reports errors as "Error: ..." already; don't show "Error: Error: ...". "PIN" is never shown.
function errText(e){
  const t = String(e || 'unknown problem').replace(/^(Error:\s*)+/, '');
  if (/^PIN required/.test(t)) return 'Wrong password: reload the page and type it again.';
  return 'Error: ' + t;
}
// A lost connection (or a Google error page) doesn't say whether the change happened.
function netText(label){
  return 'Couldn\u2019t hear back from the ' + label + ' inbox. It may still have gone through: tap Refresh and look before trying again.';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
</script>
