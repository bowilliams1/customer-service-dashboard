<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSH Customer Service</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c08; --panel:#0d130d; --panel2:#111911; --edge:#1d2a1d; --edge-lit:#2c4a2c;
  --green:#6abf4b; --green-dim:#3d7a2c; --text:#e6efe4; --dim:#7d917b;
  --red:#e05252; --red-dim:#5a2020; --amber:#e0a940;
  --ne:#6abf4b; --bc:#e0a940; --mu:#4ba5bf; --ph:#b07ad6;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  background-image:
    linear-gradient(rgba(106,191,75,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(106,191,75,.025) 1px, transparent 1px);
  background-size:44px 44px;
  min-height:100vh;
}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
.dim{color:var(--dim);}

/* header */
header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
header img{height:40px;}
header .title{font-size:26px;text-transform:uppercase;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}

/* panel with corner brackets */
.panel{
  position:relative; background:var(--panel); border:1px solid var(--edge);
  padding:18px; margin-bottom:20px;
}
.panel::before,.panel::after{
  content:''; position:absolute; width:10px; height:10px; border-color:var(--green);
  border-style:solid; border-width:0;
}
.panel::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;}
.panel::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;}
.section-head{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  font-size:13px; letter-spacing:.08em; color:var(--dim); margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:center;
}

/* KPI strip */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.kpi{
  background:var(--panel); border:1px solid var(--edge); border-left:3px solid var(--green);
  padding:14px 16px;
}
.kpi.red{border-left-color:var(--red);}
.kpi .num{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1;}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-top:6px;}

/* badges */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:3px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;font-weight:600;color:#0a0f0a;flex-shrink:0;
}
.badge.ne{background:var(--ne);} .badge.bc{background:var(--bc);}
.badge.mu{background:var(--mu);} .badge.ph{background:var(--ph);}
.badge.internal{background:var(--dim);}

.tier{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  text-transform:uppercase; letter-spacing:.05em; padding:3px 7px; border-radius:2px;
}
.tier.GREEN{background:rgba(106,191,75,.15);color:var(--green);}
.tier.YELLOW{background:rgba(224,169,64,.15);color:var(--amber);}
.tier.RED{background:rgba(224,82,82,.18);color:var(--red);}

/* queue rows */
.row{
  display:flex; gap:12px; align-items:flex-start; padding:14px 12px;
  border-bottom:1px solid var(--edge); cursor:pointer;
}
.row:last-child{border-bottom:none;}
.row:hover{background:var(--panel2);}
.row .meta{flex:1;min-width:0;}
.row .subject{font-weight:500;}
.row .from{font-size:12px;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
.row .snippet{font-size:12px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{color:var(--dim);font-size:13px;padding:20px;text-align:center;}

/* detail / editor */
.detail-body{white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;background:var(--panel2);border:1px solid var(--edge);padding:12px;margin:8px 0;}
textarea{
  width:100%; min-height:240px; background:var(--panel2); color:var(--text);
  border:1px solid var(--edge-lit); font-family:'IBM Plex Mono',monospace; font-size:13px;
  padding:12px; line-height:1.5;
}
.btn{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; font-size:13px; padding:10px 18px; border:1px solid var(--edge-lit);
  background:var(--panel2); color:var(--text); cursor:pointer;
}
.btn:hover{border-color:var(--green);}
.btn.primary{background:var(--green-dim);border-color:var(--green);color:#fff;}
.btn.danger{border-color:var(--red-dim);color:var(--red);}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
/* Detail pop-up scrolls on its own. Before this, a long thread (Karen, 2026-09-25) ran off the
   bottom of the screen with no way to reach the draft or the Send button. */
#detail-overlay{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px;}
#detail-panel{max-width:760px;margin:24px auto 60px;}
body.modal-open{overflow:hidden;}
.detail-body{overflow-wrap:anywhere;}
details.older{margin:6px 0 4px;}
details.older > summary{cursor:pointer;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:6px 0;}
details.older .detail-body{max-height:50vh;overflow-y:auto;}
textarea{box-sizing:border-box;}
.redraft{margin-top:16px;border-top:1px solid var(--edge);padding-top:12px;}
.redraft input{width:100%;box-sizing:border-box;background:var(--panel2);color:var(--text);border:1px solid var(--edge-lit);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px;margin:6px 0 8px;}
@media (max-width:560px){
  #detail-panel{margin:12px auto 40px;}
  textarea,.redraft input{font-size:16px;} /* 16px+ stops phones from zooming in on tap */
}

/* PIN gate */
#pin-gate{
  min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;
  gap:18px;
}
#pin-gate input{
  background:var(--panel2); border:1px solid var(--edge-lit); color:var(--text);
  font-family:'IBM Plex Mono',monospace; font-size:18px; padding:12px 16px; text-align:center;
  letter-spacing:.2em; width:220px;
}
#pin-error{color:var(--red);font-size:12px;min-height:16px;}

#app{display:none;}
.coming-soon{opacity:.4;font-size:12px;font-family:'IBM Plex Mono',monospace;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:820px){.two-col{grid-template-columns:1fr;}}
</style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
// Paste each engine's deployed Web App /exec URL here once it exists. An engine with url:null
// renders as "coming soon" and is skipped by every fetch — safe to leave MTEC USA / Pee-H as
// null until those engines are actually built.
const ENGINES = [
  { code: 'ne', label: 'Natural Elements', url: 'https://script.google.com/macros/s/AKfycbx7Qb9RMWiIP4OAInsc4OchJpdUMZd9DdB1e8TPLL_7UsD7L9GHvwhGcHnOmw40MkGD/exec' },
  { code: 'bc', label: 'BOSH Chemical',    url: 'https://script.google.com/macros/s/AKfycbwJC7UNmm0aq1r6kjY14GFDn3qXjKlq3SlwGdfQWVaW1N6aemaHpLLPDAjYEiMICdbosQ/exec' },
  { code: 'mu', label: 'MTEC USA',         url: null },
  { code: 'ph', label: 'Pee-H',            url: null },
];

let PIN = '';
let allRows = []; // each row carries a synthetic _engine field so actions know where to POST

function unlock(){
  PIN = document.getElementById('pin-input').value.trim();
  if (!PIN) return;
  document.getElementById('pin-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
}
document.getElementById('pin-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') unlock();
});

function activeEngines(){
  return ENGINES.filter(function(e){ return e.url && e.url.indexOf('PASTE_') !== 0; });
}

async function loadAll(){
  const engines = activeEngines();
  // Apps Script can take 15-30s to wake up, so show that we're working instead of an empty queue.
  document.getElementById('queue-list').innerHTML = '<div class="empty">Loading ' + engines.length + ' inboxes… this can take up to 30 seconds.</div>';
  const results = await Promise.all(engines.map(function(engine){
    return fetch(engine.url + '?action=getData&pin=' + encodeURIComponent(PIN))
      .then(function(r){ return r.json(); })
      .then(function(data){ return { engine: engine, data: data }; })
      .catch(function(err){ return { engine: engine, data: { error: String(err) } }; });
  }));

  allRows = [];
  let anyPinError = false;
  const failed = [];
  results.forEach(function(result){
    const data = result.data;
    if (data.error === 'PIN required') anyPinError = true;
    else if (data.error) failed.push(result.engine.label);
    if (data.inquiries) {
      data.inquiries.forEach(function(row){
        row._engineCode = result.engine.code;
        row._engineUrl = result.engine.url;
        allRows.push(row);
      });
    }
  });

  if (anyPinError) {
    document.getElementById('pin-error').textContent = 'Wrong password.';
    document.getElementById('pin-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }

  renderKpis();
  renderQueue();
  // Never let a broken engine look like "all caught up".
  if (failed.length) {
    document.getElementById('queue-list').insertAdjacentHTML('afterbegin',
      '<div class="empty" style="color:var(--red)">Couldn\u2019t reach: ' + failed.map(escapeHtml).join(', ') + '. Tap Refresh to try again.</div>');
  }
}

function renderKpis(){
  const pending = allRows.filter(function(r){ return r.Status === 'PENDING'; });
  const red = pending.filter(function(r){ return r['Safety Tier'] === 'RED'; });
  const byEngine = {};
  activeEngines().forEach(function(e){ byEngine[e.code] = 0; });
  pending.forEach(function(r){ byEngine[r._engineCode] = (byEngine[r._engineCode] || 0) + 1; });

  let html = '';
  html += kpiTile(pending.length, 'Pending review', red.length > 0);
  html += kpiTile(red.length, 'Flagged RED', red.length > 0);
  activeEngines().forEach(function(e){
    html += kpiTile(byEngine[e.code] || 0, e.label);
  });
  document.getElementById('kpi-row').innerHTML = html;
}
function kpiTile(num, label, isRed){
  return '<div class="kpi' + (isRed ? ' red' : '') + '"><div class="num">' + num +
    '</div><div class="label">' + label + '</div></div>';
}

function renderQueue(){
  const pending = allRows.filter(function(r){ return r.Status === 'PENDING' || r.Status === 'APPROVED'; })
    .sort(function(a,b){ return (a['Safety Tier'] === 'RED' ? 0 : 1) - (b['Safety Tier'] === 'RED' ? 0 : 1); });

  const list = document.getElementById('queue-list');
  if (pending.length === 0) {
    list.innerHTML = '<div class="empty">Nothing waiting — all caught up.</div>';
    return;
  }
  list.innerHTML = pending.map(function(row){
    const isInternal = String(row.Category || '').indexOf('INTERNAL:') === 0;
    const badge = isInternal
      ? '<span class="badge internal" title="Internal note">→J</span>'
      : '<span class="badge ' + row._engineCode + '">' + row._engineCode.toUpperCase() + '</span>';
    return '<div class="row" onclick="openDetail(\'' + row['Row Key'] + '\',\'' + row._engineCode + '\')">' +
      badge +
      '<div class="meta">' +
        '<div class="subject">' + escapeHtml(row.Subject || '(no subject)') + '</div>' +
        '<div class="from">' + escapeHtml(row.From || '') + ' · ' + escapeHtml(row.Category || '') + '</div>' +
        '<div class="snippet">' + escapeHtml((row.Draft || '').slice(0, 140)) + '</div>' +
      '</div>' +
      '<span class="tier ' + row['Safety Tier'] + '">' + row['Safety Tier'] + '</span>' +
    '</div>';
  }).join('');
}

function findRow(rowKey, engineCode){
  return allRows.find(function(r){ return r['Row Key'] === rowKey && r._engineCode === engineCode; });
}

function openDetail(rowKey, engineCode){
  const row = findRow(rowKey, engineCode);
  if (!row) return;
  const overlay = document.getElementById('detail-overlay');
  const panel = document.getElementById('detail-panel');
  const isInternal = String(row.Category || '').indexOf('INTERNAL:') === 0;
  const parts = splitThread(row.Body);
  panel.innerHTML =
    '<div class="section-head"><span>' + escapeHtml(row.Subject || '') + '</span>' +
    '<button class="btn" onclick="closeDetail()" style="font-size:11px;padding:6px 12px;">Close</button></div>' +
    '<div class="mono dim" style="font-size:12px;">From: ' + escapeHtml(row.From || '') +
    ' &nbsp; Tier: <span id="detail-tier" class="tier ' + row['Safety Tier'] + '">' + row['Safety Tier'] + '</span></div>' +
    '<div id="detail-flags" class="mono" style="font-size:12px;color:var(--amber);margin-top:6px;">' + (row['Safety Reasons'] ? 'Flags: ' + escapeHtml(row['Safety Reasons']) : '') + '</div>' +
    '<div class="detail-body">' + escapeHtml(parts.latest) + '</div>' +
    (parts.older ? '<details class="older"><summary>Show earlier messages in this thread</summary><div class="detail-body">' + escapeHtml(parts.older) + '</div></details>' : '') +
    '<div style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;">Draft — edit below if needed</div>' +
    '<textarea id="draft-edit">' + escapeHtml(row.Draft || '') + '</textarea>' +
    '<div class="btn-row">' +
      '<button class="btn primary" onclick="doAction(\'approveSend\',\'' + rowKey + '\',\'' + engineCode + '\')">Send</button>' +
      '<button class="btn danger" onclick="doAction(\'reject\',\'' + rowKey + '\',\'' + engineCode + '\')">Reject</button>' +
      (!isInternal ? '<button class="btn" onclick="doAction(\'createJeffNotification\',\'' + rowKey + '\',\'' + engineCode + '\')">Flag for Reshipment → Jeff</button>' : '') +
    '</div>' +
    (!isInternal ?
      '<div class="redraft">' +
        '<div style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;">Not right? Tell Claude what to change (optional), then Redraft</div>' +
        '<input id="redraft-note" type="text" placeholder="e.g. Use 8 oz, let it sit overnight, rinse with warm water">' +
        '<button class="btn" id="redraft-btn" onclick="doRedraft(\'' + rowKey + '\',\'' + engineCode + '\')">Redraft</button>' +
        '<span id="redraft-status" class="mono dim" style="font-size:12px;margin-left:10px;"></span>' +
      '</div>' : '');
  overlay.style.display = 'block';
  overlay.scrollTop = 0;
  document.body.classList.add('modal-open');
}
function closeDetail(){
  document.getElementById('detail-overlay').style.display = 'none';
  document.body.classList.remove('modal-open');
}

// Splits the newest message from the quoted history below it (Gmail "On ... wrote:", ">" quote
// lines, Outlook "Original Message" / "From: ... Sent:") so a long thread doesn't bury what's new.
// If nothing sits above the quote, show everything rather than an empty box.
function splitThread(body){
  const s = String(body || '');
  const cands = [
    s.search(/(^|\n)On [^\n]{0,200}(\n[^\n]{0,200})?wrote:[ \t]*\r?\n/),
    s.search(/(^|\n)>/),
    s.search(/(^|\n)-{2,}\s*Original Message/i),
    s.search(/(^|\n)From: [^\n]+\n(Sent|Date): /),
  ].filter(function(i){ return i > 0; });
  if (!cands.length) return { latest: s, older: '' };
  const cut = Math.min.apply(null, cands);
  const latest = s.slice(0, cut).trim();
  if (!latest) return { latest: s, older: '' };
  return { latest: latest, older: s.slice(cut).trim() };
}

// Bo's Redraft button: sends his optional note to the engine, which re-runs Claude with it and
// updates the row in place. The new draft drops straight into the edit box, ready to review.
async function doRedraft(rowKey, engineCode){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  const btn = document.getElementById('redraft-btn');
  const status = document.getElementById('redraft-status');
  const note = document.getElementById('redraft-note').value.trim();
  btn.disabled = true;
  status.textContent = 'Redrafting… this can take up to a minute.';
  try {
    const res = await fetch(engine.url, { method: 'POST', body: JSON.stringify({ action: 'redraft', rowKey: rowKey, note: note, pin: PIN }) })
      .then(function(r){ return r.json(); });
    if (res.error) { status.textContent = ''; alert('Error: ' + res.error); return; }
    document.getElementById('draft-edit').value = res.draft;
    const tierEl = document.getElementById('detail-tier');
    tierEl.textContent = res.tier; tierEl.className = 'tier ' + res.tier;
    document.getElementById('detail-flags').textContent = res.reasons ? ('Flags: ' + res.reasons) : '';
    const row = findRow(rowKey, engineCode);
    if (row) { row.Draft = res.draft; row['Safety Tier'] = res.tier; row['Safety Reasons'] = res.reasons; row.Category = res.category; }
    status.textContent = 'New draft is ready above. Review it, then Send.';
    renderKpis();
    renderQueue();
  } catch (err) {
    status.textContent = '';
    alert('Error: ' + err);
  } finally {
    btn.disabled = false;
  }
}

async function doAction(action, rowKey, engineCode){
  const engine = ENGINES.find(function(e){ return e.code === engineCode; });
  const editedDraft = document.getElementById('draft-edit') ? document.getElementById('draft-edit').value : undefined;
  const body = { action: action, rowKey: rowKey, pin: PIN };
  if (action === 'approveSend') body.editedDraft = editedDraft;
  if (action === 'createJeffNotification') body.editedNote = editedDraft;

  const res = await fetch(engine.url, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  if (res.error) { alert('Error: ' + res.error); return; }
  closeDetail();
  loadAll();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
